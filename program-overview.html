<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAKS Program Overview — All Classes</title>
<meta name="description" content="North Alabama Korean School — a complete overview of all eight class levels, from Seeds to Tree.">
<style>
:root{
  --ink:#1d1d1f; --ink-soft:#4b4b50; --ink-faint:#86868b; --line:#e3e3e6;
  --accent:#d23c4c; --accent-dk:#b22f3d; --blue:#1f4788; --green:#9bc23a;
  --scale:1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK KR",
    "Apple SD Gothic Neo","Malgun Gothic",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:#f4f4f6;
}
.toolbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px;
  padding:11px 20px; background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.toolbar .tb-title{font-size:14px; font-weight:600; letter-spacing:-.01em;}
.toolbar .tb-title span{color:var(--ink-faint); font-weight:500;}
.toolbar .spacer{flex:1;}
.btn{
  font:inherit; font-size:13.5px; font-weight:600; letter-spacing:-.01em; cursor:pointer;
  border-radius:980px; padding:8px 17px; border:1px solid transparent; transition:.15s ease;
}
.btn-print{background:var(--accent); color:#fff;}
.btn-print:hover{background:var(--accent-dk);}
.btn-exit{background:transparent; color:var(--ink-soft); border-color:var(--line);}
.btn-exit:hover{background:#fff; color:var(--ink);}
.hint{font-size:12px; color:var(--ink-faint); margin-left:2px;}
.viewer{padding:26px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:26px;}

.sheet{
  width:8.5in; height:11in; background:#fff; position:relative; overflow:hidden;
  padding:0.5in 0.5in 0.42in; box-shadow:0 6px 30px rgba(0,0,0,.14); border-radius:2px;
  display:flex; flex-direction:column;
}
.sheet .masthead{display:flex; align-items:center; gap:13px; padding-bottom:10px; border-bottom:2px solid var(--ink);}
.emblem{width:46px; height:46px; object-fit:contain; flex:none;}
.titles{flex:1; min-width:0;}
.school{font-size:17px; font-weight:700; letter-spacing:-.02em; line-height:1.05;}
.school-alt{font-size:11px; color:var(--ink-faint); font-weight:500; margin-top:1px;}
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); text-align:right; align-self:center;}
.intro{margin:9px 0 11px; font-size:11px; line-height:1.45; color:var(--ink-soft); max-width:62ch;}

.grid{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0 11px; min-height:0;}
.col{display:flex; flex-direction:column; justify-content:flex-start; gap:9px; min-height:0;}
.card{
  border:1px solid var(--line); border-left:3px solid var(--stage); border-radius:9px;
  padding:calc(7px*var(--scale)) calc(10px*var(--scale)); display:flex; flex-direction:column;
  min-height:0; background:#fff;
}
.card header{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.cn{display:flex; align-items:baseline; gap:6px; min-width:0;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--stage); flex:none; align-self:center;}
.cn h3{margin:0; font-size:calc(13px*var(--scale)); font-weight:700; letter-spacing:-.01em; line-height:1;}
.cn .alt{font-size:calc(10px*var(--scale)); color:var(--ink-faint); font-weight:500;}
.chip{font-size:calc(8.6px*var(--scale)); font-weight:600; color:var(--ink-soft);
  background:#f1f1f3; border-radius:980px; padding:2.5px 8px; white-space:nowrap; flex:none;}
.sum{margin:calc(4px*var(--scale)) 0 calc(5px*var(--scale)); font-size:calc(9.6px*var(--scale));
  line-height:1.35; color:var(--ink-soft);}
.card ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:calc(2.5px*var(--scale));}
.card li{position:relative; padding-left:11px; font-size:calc(9.3px*var(--scale)); line-height:1.32; color:var(--ink);}
.card li::before{content:""; position:absolute; left:0; top:.42em; width:4px; height:4px; border-radius:50%; background:var(--green);}
.tb{margin-top:auto; padding-top:calc(4px*var(--scale)); font-size:calc(8.7px*var(--scale)); color:var(--ink-faint); line-height:1.3;}
.tb span{font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-right:5px; font-size:calc(7.8px*var(--scale));}

.foot{display:flex; align-items:center; gap:14px; margin-top:10px; padding-top:9px; border-top:1px solid var(--line);}
.qr{display:flex; align-items:center; gap:8px; flex:none;}
.qr img{width:64px; height:64px; display:block;}
.qrcap{display:flex; flex-direction:column; line-height:1.2;}
.qrcap strong{font-size:10.5px; font-weight:700;}
.qrcap span{font-size:9px; color:var(--ink-faint);}
.note{margin:0; font-size:8.7px; line-height:1.4; color:var(--ink-faint); flex:1;}
.note strong{color:var(--ink-soft); font-weight:700;}
.fallback{padding:60px; text-align:center; color:var(--ink-faint); font-size:14px;}

/* ===== Mobile / narrow screens =====
   The sheets are fixed 8.5x11in "pages", sized for print and desktop.
   On a phone that page is far wider than the screen, so here each sheet
   reflows into a single, full-width, readable column. Correct card
   order (0–7) is kept by dissolving the two print columns with
   display:contents and honoring the per-card `order` set in the JS.
   The desktop view (>900px) and the printed PDF are left untouched. */
@media screen and (max-width:900px){
  html,body{ -webkit-text-size-adjust:100%; }
  .toolbar{ gap:10px; padding:10px 14px; flex-wrap:wrap; }
  .toolbar .tb-title{ font-size:13px; }
  .toolbar .hint{ display:none; }
  .toolbar .btn{ padding:7px 14px; font-size:13px; }

  .viewer{ padding:16px 12px 34px; gap:20px; align-items:stretch; }
  .sheet{
    --scale:1.7;
    width:100%; height:auto; min-height:0;
    padding:24px 18px 22px; border-radius:14px;
  }
  .masthead{ flex-wrap:wrap; align-items:center; }
  .titles{ flex:1 1 auto; }
  .school{ font-size:20px; }
  .school-alt{ font-size:13px; margin-top:2px; }
  /* drop the eyebrow onto its own full-width line so the school name
     keeps its full width and doesn't wrap one syllable per line */
  .eyebrow{ flex:1 0 100%; text-align:left; font-size:12px; margin-top:8px; align-self:auto; }
  .intro{ font-size:15px; line-height:1.5; max-width:none; margin:12px 0 6px; }

  /* dissolve the two print columns and stack all eight cards in order */
  .col{ display:contents; }
  .grid{ display:flex; flex-direction:column; gap:14px; }

  .foot{ flex-wrap:wrap; gap:12px; }
  .qrcap strong{ font-size:13px; }
  .qrcap span{ font-size:11px; }
  .note{ font-size:12px; line-height:1.5; flex:1 1 100%; }
}

@page{size:Letter portrait; margin:0;}
@media print{
  body{background:#fff;}
  .toolbar{display:none !important;}
  .viewer{padding:0; gap:0;}
  .sheet{box-shadow:none; border-radius:0; width:8.5in; height:11in; page-break-after:always;}
  .sheet:last-child{page-break-after:auto;}
}
</style>
</head>

var STAGE = ["#9bc23a","#7fb135","#57a83f","#3f9e6a","#d23c4c","#b22f3d","#1f4788","#163563"];
var COPY = {
  en:{ primary:"North Alabama Korean School", secondary:"북알라바마 한국학교",
    eyebrow:"Program Overview · All Classes",
    intro:"Eight classes grow with your child — from Seeds to Tree — pairing the Korean language with cultural immersion at every age.",
    tbLabel:"Textbook", qr1:"Scan to enroll", qr2:"northalabamakoreanschool.org",
    note:"<strong>Class placement</strong> is determined at the discretion of the school administrators, based on each student’s assessed Korean proficiency and fit for the class. Ages listed are a guide, not a guarantee of placement." },
  ko:{ primary:"북알라바마 한국학교", secondary:"North Alabama Korean School",
    eyebrow:"교육과정 안내 · 전체 과정",
    intro:"여덟 개의 반이 아이와 함께 자랍니다 — 씨앗반부터 나무반까지, 모든 연령에서 한국어와 문화 체험을 함께 담습니다.",
    tbLabel:"교재", qr1:"스캔하여 등록", qr2:"northalabamakoreanschool.org",
    note:"<strong>반 배정</strong>은 각 학생의 평가된 한국어 수준과 반에 대한 적합성을 바탕으로 학교 관리자의 재량으로 결정됩니다. 표기된 연령은 참고 기준이며 배정을 보장하지 않습니다." }
};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function t(o,l){ if(o==null)return""; if(typeof o==="string")return o; return o[l]||o.en||o.ko||""; }
function splitTopics(level){
  var bullets=[], tb=null;
  (level.topics||[]).forEach(function(tp){
    if((tp.en&&tp.en.indexOf("Uses the")===0)||(tp.ko&&tp.ko.indexOf("교재")===0)) tb=tp;
    else bullets.push(tp);
  });
  return {bullets:bullets, tb:tb};
}
function card(level,i,lang){
  var st=splitTopics(level);
  var lis=st.bullets.map(function(b){return "<li>"+esc(t(b,lang))+"</li>";}).join("");
  var tb="";
  if(st.tb){ var val=t(st.tb,lang).replace("Uses the ","").replace("교재: ","");
    tb='<div class="tb"><span>'+COPY[lang].tbLabel+'</span>'+esc(val)+'</div>'; }
  return '<article class="card" style="--stage:'+STAGE[i]+';order:'+i+'">'
    +'<header><div class="cn"><span class="dot"></span><h3>'+esc(t(level.name,lang))
      +'</h3><span class="alt">'+esc(t(level.koClassName,lang))+'</span></div>'
      +'<span class="chip">'+esc(t(level.sub,lang))+'</span></header>'
    +'<p class="sum">'+esc(t(level.summary,lang))+'</p>'
    +'<ul>'+lis+'</ul>'+tb+'</article>';
}
function sheet(levels,lang){
  var c=COPY[lang];
  function col(idxs){ return idxs.map(function(i){return card(levels[i],i,lang);}).join(""); }
  return '<section class="sheet" lang="'+lang+'">'
    +'<header class="masthead"><img class="emblem" src="'+EMBLEM+'" alt="NAKS emblem">'
      +'<div class="titles"><div class="school">'+c.primary+'</div>'
      +'<div class="school-alt">'+c.secondary+'</div></div>'
      +'<div class="eyebrow">'+c.eyebrow+'</div></header>'
    +'<p class="intro">'+c.intro+'</p>'
    +'<div class="grid"><div class="col">'+col([0,2,4,6])+'</div>'
      +'<div class="col">'+col([1,3,5,7])+'</div></div>'
    +'<footer class="foot"><div class="qr"><img src="'+QR+'" alt="QR to enroll">'
      +'<div class="qrcap"><strong>'+c.qr1+'</strong><span>'+c.qr2+'</span></div></div>'
      +'<p class="note">'+c.note+'</p></footer></section>';
}
function build(){
  var v=document.getElementById("viewer");
  var P=(window.SITE&&window.SITE.programs)||null;
  if(!P||!P.levels||P.levels.length<8){
    v.innerHTML='<div class="fallback">Curriculum data could not be loaded.</div>'; return;
  }
  v.innerHTML = sheet(P.levels,"en") + sheet(P.levels,"ko");
}
function naksPrint(){ window.print(); }
function naksExit(){
  if (document.referrer && document.referrer.indexOf(location.host)!==-1 && history.length>1) history.back();
  else location.href="index.html#programs";
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") naksExit(); });
build();
</script>
